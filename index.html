<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
:root{--ink:#1b2447;--muted:#6b7599;--line:#dfe5f7;--blue:#2563eb;--violet:#6d28d9;--red:#c62828;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:400 15px/1.4 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background:linear-gradient(rgba(120,140,220,.07) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(120,140,220,.07) 1px,transparent 1px) 0 0/40px 40px,
  radial-gradient(900px 500px at 15% 0%,#e3e9ff,transparent 70%),radial-gradient(800px 500px at 95% 20%,#efe8ff,transparent 70%),#f1f4fd}
input{-webkit-user-select:text;user-select:text}
img,svg{-webkit-user-drag:none}
.lg{min-height:100%;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.lg.off{display:none}
.lg-card{position:relative;overflow:hidden;width:100%;max-width:410px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:38px 30px 28px;box-shadow:0 30px 80px -40px rgba(60,80,200,.5);animation:lgrise .35s ease-out}
.lg-card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--blue),var(--violet))}
@keyframes lgrise{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.lg-ic{width:68px;height:68px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 0 0 8px rgba(37,99,235,.09)}
.lg-ic svg{width:30px;height:30px}
.lg-card h1{margin:0;text-align:center;font-size:1.65rem;font-weight:800;letter-spacing:-.03em}
.lg-sub{margin:6px 0 24px;text-align:center;font:500 .68rem "DM Mono",ui-monospace,monospace;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.lg-card label{display:block;margin:0 0 5px;font:500 .66rem "DM Mono",ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.lg-card input{width:100%;height:48px;border:1px solid #d9ccfb;border-radius:12px;padding:0 14px;font:500 16px "DM Mono",ui-monospace,monospace;background:#fff;color:var(--ink)}
.lg-card input:focus-visible{outline:3px solid #a78bfa;outline-offset:1px}
.lg-fld{margin-bottom:16px}
.lg-pw{position:relative}
.lg-pw input{padding-right:48px}
.lg-eye{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.lg-eye:hover{background:#f1f4fd;color:var(--blue)}
.lg-eye svg{width:18px;height:18px}
.lg-msg{min-height:1.3em;margin:-4px 0 12px;font-size:.84rem;color:var(--red);text-align:center}
.lg-go{width:100%;height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;font:700 1rem "DM Sans",sans-serif;cursor:pointer;box-shadow:0 12px 24px -12px rgba(80,60,220,.7);transition:filter .15s,transform .05s}
.lg-go:hover{filter:brightness(1.08)}
.lg-go:active{transform:translateY(1px)}
.lg-go:disabled{opacity:.55;cursor:not-allowed;filter:none}
.lg-go:focus-visible{outline:3px solid #a78bfa;outline-offset:2px}

.lw{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(27,36,71,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.lw.on{display:flex}
.lw-card{position:relative;overflow:hidden;width:100%;max-width:400px;background:#fff;border-radius:26px;padding:32px 26px 24px;text-align:center;box-shadow:0 30px 80px -30px rgba(20,30,90,.6);animation:lgrise .22s ease-out}
.lw-card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#e53935,#ff8a65)}
.lw-card h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.lw-card p{margin:0;color:var(--muted);font-size:.92rem}
.lw-t{margin:14px auto 18px;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#fdeeee;border:3px solid #f2c2c2;color:var(--red);font:800 2.2rem "DM Sans",sans-serif}
.lw-b{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lw-b button{flex:1;min-width:130px;height:46px;border-radius:14px;font:700 .92rem "DM Sans",sans-serif;cursor:pointer;border:1px solid}
.lw-stay{background:linear-gradient(135deg,var(--blue),var(--violet));border-color:transparent;color:#fff}
.lw-out{background:#fff;border-color:#f2c2c2;color:var(--red)}
.lw-b button:focus-visible{outline:3px solid #a78bfa;outline-offset:2px}
.lw-fix{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:60}
@media (max-width:420px){.lg{padding:14px}.lg-card{padding:32px 20px 22px;border-radius:22px}}
</style>
</head>
<body>
<main class="lg" id="lg">
  <form class="lg-card" id="lgForm" autocomplete="on" novalidate>
    <div class="lg-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/><path d="M12 15.5v2"/></svg></div>
    <h1>Sign in</h1>
    <p class="lg-sub">Authorised access only</p>
    <div class="lg-fld"><label for="lgU">User ID</label>
      <input id="lgU" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div class="lg-fld"><label for="lgP">Password</label>
      <div class="lg-pw"><input id="lgP" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
        <button class="lg-eye" id="lgEye" type="button" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <div class="lg-msg" id="lgMsg" role="alert" aria-live="polite"></div>
    <button class="lg-go" id="lgGo" type="submit">Sign in</button>
  </form>
</main>

<div class="lw" id="lw" role="alertdialog" aria-modal="true" aria-labelledby="lwT">
  <div class="lw-card">
    <h2 id="lwT">Session expiring</h2>
    <p>No activity detected. You will be signed out in</p>
    <div class="lw-t" id="lwN">30</div>
    <div class="lw-b"><button class="lw-stay" id="lwStay" type="button">Stay signed in</button><button class="lw-out" id="lwOut" type="button">Logout now</button></div>
  </div>
</div>

var IT=600000;
var LIMIT=60000;                /* 1 minute without activity -> warning popup */
var WARN=30000;                 /* 30 more seconds -> sign out */

var enc=new TextEncoder(),dec=new TextDecoder();
var key=null,payload=null,live=false,last=Date.now();
function $(i){return document.getElementById(i);}
function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);}
function swap(s,n,v){var a='/*'+n+'_'+'START*/',b='/*'+n+'_'+'END*/',i=s.indexOf(a),j=s.indexOf(b);if(i<0||j<i)throw new Error('marker');return s.slice(0,i+a.length)+v+s.slice(j);}
function deriveKey(user,pass){
  return crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+'\u0000'+pass),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});
}

/* ---- deterrents: right-click, shortcuts, dragging ---- */
try{localStorage.removeItem('approval_matrix_state_v3');}catch(e){}   /* clear any old plain-text copy */
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('dragstart',function(e){e.preventDefault();});
document.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey,bad=false;
  if(e.key==='F12')bad=true;
  else if(mod&&e.shiftKey&&'ijcke'.indexOf(k)>-1&&k.length===1)bad=true;
  else if(mod&&e.altKey&&'iujc'.indexOf(k)>-1&&k.length===1)bad=true;
  else if(mod&&(k==='u'||k==='s'))bad=true;
  if(bad){e.preventDefault();e.stopPropagation();}
},true);

/* ---- login form ---- */
function msg(t){$('lgMsg').textContent=t||'';}
function busy(on){$('lgGo').disabled=on;$('lgGo').textContent=on?'Verifying…':'Sign in';}
var DELAYS=[0,0,0,10,30,60,120,300],tick=null;
function fails(){try{return JSON.parse(localStorage.getItem('amx_f'))||{n:0,until:0};}catch(e){return {n:0,until:0};}}
function setFails(o){try{localStorage.setItem('amx_f',JSON.stringify(o));}catch(e){}}
function showLock(){
  var f=fails(),left=Math.ceil((f.until-Date.now())/1000);
  clearTimeout(tick);
  if(left>0){$('lgGo').disabled=true;msg('Too many attempts. Try again in '+left+'s.');tick=setTimeout(showLock,500);}
  else if($('lgMsg').textContent.indexOf('Too many')===0){msg('');$('lgGo').disabled=false;}
}
$('lgEye').addEventListener('click',function(){var p=$('lgP'),show=p.type==='password';p.type=show?'text':'password';this.setAttribute('aria-label',show?'Hide password':'Show password');});
$('lgForm').addEventListener('submit',function(e){e.preventDefault();login();});
showLock();

function login(){
  var f=fails();
  if(f.until>Date.now()){showLock();return;}
  if(!window.crypto||!crypto.subtle){msg('Please open this page over HTTPS.');return;}
  var u=$('lgU').value,p=$('lgP').value;
  if(!u.trim()||!p){msg('Enter your User ID and password.');return;}
  msg('');busy(true);
  deriveKey(u,p).then(function(k){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},k,u8(CT)).then(function(pt){
      payload=JSON.parse(dec.decode(pt));key=k;});
  }).then(function(){
    setFails({n:0,until:0});$('lgP').value='';$('lgU').value='';
    return loadLocal();
  }).then(mount,function(){
    var n=f.n+1;setFails({n:n,until:Date.now()+DELAYS[Math.min(n,DELAYS.length-1)]*1000});
    $('lgP').value='';busy(false);msg('Incorrect User ID or password.');showLock();
  });
}

/* ---- encrypted local copy of edits (never stored in plain text) ---- */
function loadLocal(){
  window.__LOCAL=null;
  try{var r=localStorage.getItem('amx_l');if(!r)return Promise.resolve();var o=JSON.parse(r);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(o.iv)},key,u8(o.ct)).then(function(pt){window.__LOCAL=JSON.parse(dec.decode(pt));},function(){});}
  catch(e){return Promise.resolve();}
}
function saveLocal(obj){
  if(!key)return;
  var iv=crypto.getRandomValues(new Uint8Array(12));
  crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify(obj))).then(function(ct){
    try{localStorage.setItem('amx_l',JSON.stringify({iv:b64(iv),ct:b64(ct)}));}catch(e){}},function(){});
}

/* ---- export an updated, re-encrypted index.html ---- */
function exportFile(ver,data){
  if(!key||!payload)return Promise.resolve(false);
  var js;
  try{js=swap(swap(payload.js,'VER',JSON.stringify(ver)),'DATA',data);}catch(e){return Promise.resolve(false);}
  var next={title:payload.title,css:payload.css,body:payload.body,js:js};
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify(next))).then(function(ct){
    return fetch(location.pathname,{cache:'no-store'}).then(function(r){return r.text();}).catch(function(){return '';}).then(function(src){
      if(!src||src.indexOf('/*CT_'+'START*/')<0){
        var c=document.documentElement.cloneNode(true);
        c.querySelectorAll('[data-app]').forEach(function(n){n.remove();});
        var l=c.querySelector('#lg');if(l)l.classList.remove('off');
        src='<!DOCTYPE html>\n'+c.outerHTML;
      }
      src=swap(swap(src,'IV',JSON.stringify(b64(iv))),'CT',JSON.stringify(b64(ct)));
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([src],{type:'text/html'}));
      a.download='index.html';document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
      payload=next;return true;
    });
  }).catch(function(){return false;});
}

/* ---- sign out ---- */
function logout(){
  if(!live)return;live=false;$('lw').classList.remove('on');key=null;payload=null;window.__LOCAL=null;
  document.querySelectorAll('[data-app]').forEach(function(n){n.remove();});
  try{navigator.clipboard.writeText('');}catch(e){}
  location.reload();
}

/* ---- start the protected page ---- */
function mount(){
  var st=document.createElement('style');st.setAttribute('data-app','');st.textContent=payload.css;document.head.appendChild(st);
  var root=document.createElement('div');root.id='appRoot';root.setAttribute('data-app','');root.innerHTML=payload.body;document.body.appendChild(root);
  $('lg').classList.add('off');
  document.title=payload.title||'';
  var api={exportFile:exportFile,saveLocal:saveLocal};
  Object.defineProperty(window,'__shell',{value:Object.freeze(api),configurable:false,writable:false});
  var s=document.createElement('script');s.setAttribute('data-app','');s.textContent=payload.js;document.body.appendChild(s);
  var lo=document.createElement('button');lo.type='button';lo.className='btn red';lo.textContent='Logout';lo.setAttribute('data-app','');
  var rt=document.querySelector('#appRoot .right');
  if(rt)rt.appendChild(lo);else{lo.classList.add('lw-fix');document.body.appendChild(lo);}
  lo.addEventListener('click',logout);
  live=true;last=Date.now();guards();
}

function guards(){
  ['mousemove','mousedown','keydown','touchstart','wheel','scroll'].forEach(function(ev){
    window.addEventListener(ev,function(){last=Date.now();},{passive:true,capture:true});});
  var lw=$('lw'),shown=false;
  $('lwStay').addEventListener('click',function(){last=Date.now();});
  $('lwOut').addEventListener('click',logout);
  setInterval(function(){
    if(!live)return;
    var idle=Date.now()-last;
    if(idle>=LIMIT+WARN){logout();return;}
    if(idle>=LIMIT){
      $('lwN').textContent=Math.max(0,Math.ceil((LIMIT+WARN-idle)/1000));
      if(!shown){shown=true;lw.classList.add('on');$('lwStay').focus();}
    }else if(shown){shown=false;lw.classList.remove('on');}
  },250);
  var touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  setInterval(function(){
    if(!live)return;
    if(!touch&&(window.outerWidth-window.innerWidth>240||window.outerHeight-window.innerHeight>340)){logout();return;}
    var t=performance.now();debugger;
    if(performance.now()-t>150)logout();
  },1500);
}
})();
